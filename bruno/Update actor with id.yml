info:
  name: Update actor with id
  type: http
  seq: 4

http:
  method: PUT
  url: "{{host}}/api/v1/actors/:actor_id"
  params:
    - name: actor_id
      value: "{{actor_id}}"
      type: path
  body:
    type: json
    data: "{\r

      \    \"name\": \"Clement Peerens\"\r

      }"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
