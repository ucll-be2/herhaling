info:
  name: Delete actor with id
  type: http
  seq: 5

http:
  method: DELETE
  url: "{{host}}/api/v1/actors/:actor_id"
  params:
    - name: actor_id
      value: "{{actor_id}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
