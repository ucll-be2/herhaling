info:
  name: GET /api/v1/movies with start year
  type: http
  seq: 7

http:
  method: GET
  url: "{{host}}/api/v1/movies?startYear=1990&endYear=2000"
  params:
    - name: startYear
      value: "1990"
      type: query
    - name: endYear
      value: "2000"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
