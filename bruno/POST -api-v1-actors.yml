info:
  name: POST /api/v1/actors
  type: http
  seq: 3

http:
  method: POST
  url: "{{host}}/api/v1/actors"
  body:
    type: json
    data: "{\r

      \    \"name\": \"Jos Bosmans\"\r

      }"
  auth: inherit

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.id
        method: jsonq
      variable:
        name: actor_id
        scope: runtime
      description: Set actor_id var

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
